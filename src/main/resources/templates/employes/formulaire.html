<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titre}">Formulaire employe</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="page-form">
<div class="card">

    <!-- Header -->
    <div class="card-header">
        <div class="card-logo">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
                 fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="#C9372C">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M4.501 20.118a7.5 7.5 0 0 1 14.998 0"/>
            </svg>
        </div>
        <h1 th:text="${titre}">Formulaire</h1>
        <p>Renseignez les informations de l'employe.</p>
    </div>

    <!-- Formulaire -->
    <form th:action="@{/employes/sauvegarder}" th:object="${employe}"
          method="post" id="employeForm" novalidate>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{id}"/>

        <div class="form-grid">

            <!-- Prenom -->
            <div class="form-group col-left">
                <label for="prenom">Prenom <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="15" height="15"
                         xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke-width="1.8" stroke="#6B7280">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
                    </svg>
                    <input type="text" id="prenom" th:field="*{prenom}"
                           placeholder="Ex. Felix" minlength="2" maxlength="50"
                           required aria-describedby="prenom-error"/>
                </div>
                <span class="error-text" id="prenom-error">Ce champ est obligatoire.</span>
            </div>

            <!-- Nom -->
            <div class="form-group col-right">
                <label for="nom">Nom <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="15" height="15"
                         xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke-width="1.8" stroke="#6B7280">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
                    </svg>
                    <input type="text" id="nom" th:field="*{nom}"
                           placeholder="Ex. Ngankam" minlength="2" maxlength="50"
                           required aria-describedby="nom-error"/>
                </div>
                <span class="error-text" id="nom-error">Ce champ est obligatoire.</span>
            </div>

            <!-- Email -->
            <div class="form-group col-full">
                <label for="email">Adresse e-mail <span class="required-star">*</span></label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="15" height="15"
                         xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke-width="1.8" stroke="#6B7280">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15
                                 a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0
                                 A2.25 2.25 0 0 0 19.5 4.5h-15
                                 a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243
                                 a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615
                                 a2.25 2.25 0 0 1-2.36 0L3.32 8.91
                                 a2.25 2.25 0 0 1-1.07-1.916V6.75"/>
                    </svg>
                    <input type="email" id="email" th:field="*{email}"
                           placeholder="felix@exemple.com"
                           required aria-describedby="email-error"/>
                </div>
                <span class="error-text" id="email-error">Saisissez une adresse e-mail valide.</span>
            </div>

            <!-- Poste -->
            <div class="form-group col-full">
                <label for="poste">Poste</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="15" height="15"
                         xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke-width="1.8" stroke="#6B7280">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M20.25 14.15v4.073a2.25 2.25 0 0 1-2.122 2.247
                                 5.25 5.25 0 0 1-4.256 0A2.25 2.25 0 0 1
                                 11.75 18.223V14.15M3.75 6.75h16.5
                                 M3.75 6.75A2.25 2.25 0 0 1 6 4.5h12
                                 a2.25 2.25 0 0 1 2.25 2.25v.75H3.75v-.75Z"/>
                    </svg>
                    <input type="text" id="poste" th:field="*{poste}"
                           placeholder="Ex. Developpeur" maxlength="80"/>
                </div>
            </div>

            <!-- Salaire -->
            <div class="form-group col-full">
                <label for="salaire">Salaire (EUR)</label>
                <div class="input-wrapper">
                    <svg class="input-icon" width="15" height="15"
                         xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke-width="1.8" stroke="#6B7280">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879
                                 4.242 0 1.172-.879 1.172-2.303 0-3.182
                                 C13.536 12.219 12.768 12 12 12
                                 c-.725 0-1.45-.22-2.003-.659
                                 -1.106-.879-1.106-2.303 0-3.182
                                 s2.9-.879 4.006 0l.415.33
                                 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
                    </svg>
                    <input type="number" id="salaire" th:field="*{salaire}"
                           placeholder="Ex. 45000" step="100" min="0"/>
                </div>
            </div>

        </div><!-- /form-grid -->

        <button type="submit" class="btn-submit" id="submitBtn">
            <div class="spinner"></div>
            <span class="btn-text">Enregistrer</span>
            <svg class="btn-icon" width="15" height="15"
                 xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
            </svg>
        </button>
    </form>

    <div class="card-footer">
        <a th:href="@{/employes}">Retour a la liste</a>
    </div>

</div>
</div><!-- /page-form -->

<div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<script>
(function () {
  var form   = document.getElementById('employeForm');
  var submit = document.getElementById('submitBtn');
  var toast  = document.getElementById('toast');

  form.querySelectorAll('input[required]').forEach(function(input) {
    input.addEventListener('blur',  function() { validateField(input); });
    input.addEventListener('input', function() {
      if (input.classList.contains('is-error')) validateField(input);
    });
  });

  function validateField(input) {
    var error = document.getElementById(input.id + '-error');
    var valid = input.checkValidity();
    input.classList.toggle('is-error',   !valid);
    input.classList.toggle('is-success',  valid);
    if (error) error.classList.toggle('visible', !valid);
  }

  form.addEventListener('submit', function(e) {
    var allValid = true;
    form.querySelectorAll('input[required]').forEach(function(input) {
      validateField(input);
      if (!input.checkValidity()) allValid = false;
    });
    if (!allValid) {
      e.preventDefault();
      showToast('Veuillez corriger les erreurs.', 'error');
      return;
    }
    submit.classList.add('loading');
    submit.disabled = true;
  });

  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = 'toast ' + type + ' show';
    setTimeout(function() { toast.className = 'toast'; }, 4000);
  }
})();
</script>
</body>
</html>
